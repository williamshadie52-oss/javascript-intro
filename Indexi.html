\'o_'+m.id+'_1x\',\''+m.home+' or DRAW\',\''+m.home+'\','+od.o1X+',\'DC\')">1X<b>'+od.o1X+'</b></div><div class=ouItem id=o_'+m.id+'_12 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_12\',\'HOME or AWAY\',\'DRAW\','+od.o12+',\'DC\')">12<b>'+od.o12+'</b></div><div class=ouItem id=o_'+m.id+'_x2 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_x2\',\''+m.away+' or DRAW\',\''+m.away+'\','+od.oX2+',\'DC\')">X2<b>'+od.oX2+'</b></div></div><div class=ouBtn><div class=ouItem id=o_'+m.id+'_o05 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_o05\',\'OVER 0.5\',\'OVER05\','+od.oOver05+',\'OU05\')">OVER 0.5<b>'+od.oOver05+'</b></div><div class=ouItem id=o_'+m.id+'_u05 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_u05\',\'UNDER 0.5\',\'UNDER05\','+od.oUnder05+',\'OU05\')">UNDER 0.5<b>'+od.oUnder05+'</b></div><div class=ouItem id=o_'+m.id+'_o15 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_o15\',\'OVER 1.5\',\'OVER15\','+od.oOver15+',\'OU15\')">OVER 1.5<b>'+od.oOver15+'</b></div><div class=ouItem id=o_'+m.id+'_u15 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_u15\',\'UNDER 1.5\',\'UNDER15\','+od.oUnder15+',\'OU15\')">UNDER 1.5<b>'+od.oUnder15+'</b></div></div><div class=ouBtn><div class=ouItem id=o_'+m.id+'_o25 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_o25\',\'OVER 2.5\',\'OVER25\','+od.oOver25+',\'OU25\')">OVER 2.5<b>'+od.oOver25+'</b></div><div class=ouItem id=o_'+m.id+'_u25 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_u25\',\'UNDER 2.5\',\'UNDER25\','+od.oUnder25+',\'OU25\')">UNDER 2.5<b>'+od.oUnder25+'</b></div><div class=ouItem id=o_'+m.id+'_o35 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_o35\',\'OVER 3.5\',\'OVER35\','+od.oOver35+',\'OU35\')">OVER 3.5<b>'+od.oOver35+'</b></div><div class=ouItem id=o_'+m.id+'_u35 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_u35\',\'UNDER 3.5\',\'UNDER35\','+od.oUnder35+',\'OU35\')">UNDER 3.5<b>'+od.oUnder35+'</b></div></div><div class=ouBtn><div class=ouItem id=o_'+m.id+'_o45 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_o45\',\'OVER 4.5\',\'OVER45\','+od.oOver45+',\'OU45\')">OVER 4.5<b>'+od.oOver45+'</b></div><div class=ouItem id=o_'+m.id+'_u45 onclick="event.stopPropagation();pick(\''+m.id+'\',\'o_'+m.id+'_u45\',\'UNDER 4.5\',\'UNDER45\','+od.oUnder45+',\'OU45\')">UNDER 4.5<b>'+od.oUnder45+'</b></div></div></div></div>';g.innerHTML+=html;}renderHis();restore();if(open){var el=document.getElementById('detail-'+open);if(el)el.classList.add('show');}}
function tog(id){var e=document.getElementById('detail-'+id);var s=e.classList.contains('show');document.querySelectorAll('.detailBox').forEach(d=>d.classList.remove('show'));if(!s){e.classList.add('show');open=id;}else open=null;}
function restore(){if(!cur)return;var sp=JSON.parse(localStorage.getItem('savedPicks_'+cur.email.toLowerCase())||'{}');picks=sp;for(var oid in picks){var el=document.getElementById(oid);if(el)el.classList.add('sel');}upd();}
function saveP(){if(!cur)return;localStorage.setItem('savedPicks_'+cur.email.toLowerCase(),JSON.stringify(picks));}
function pick(gid,oid,n,team,odd,market){if(!cur){alert('Lowani');return;}var el=document.getElementById(oid);if(!el)return;if(picks[oid]){delete picks[oid];el.classList.remove('sel');}else{if(market=='MAIN'||market=='DC'){for(var k in picks)if(picks[k].match==gid&&(picks[k].market=='MAIN'||picks[k].market=='DC')){var oe=document.getElementById(k);if(oe)oe.classList.remove('sel');delete picks[k];}}if(market.indexOf('OU')==0){for(var k in picks)if(picks[k].match==gid&&picks[k].market==market){var oe=document.getElementById(k);if(oe)oe.classList.remove('sel');delete picks[k];}}picks[oid]={n:n,team:team,o:odd,id:oid,match:gid,market:market};el.classList.add('sel');}saveP();upd();}
function upd(){var ks=Object.keys(picks);document.getElementById('bc').innerText=ks.length;var ls=document.getElementById('ls');var tt=document.getElementById('tt');if(!ks.length){ls.innerHTML='Sankhani';tt.innerHTML='';return;}var t='',tot=1;for(var k in picks){t+=picks[k].n+' @ '+picks[k].o+'<br>';tot*=parseFloat(picks[k].o);}ls.innerHTML=t;var s=parseInt(document.getElementById('stake').value)||100;tt.innerHTML='Odds '+tot.toFixed(2)+' | Win K'+(s*tot).toFixed(0);}
function doBet(){if(!cur){alert('Lowani');return;}var ks=Object.keys(picks);if(!ks.length){alert('Sankhani');return;}var s=parseInt(document.getElementById('stake').value)||100,tot=1,list=[];for(var k in picks){tot*=parseFloat(picks[k].o);list.push(picks[k]);}var b={id:'#BOZA'+Math.random()*90000|0,stake:s,odds:tot,picks:list,status:'PENDING',win:(s*tot).toFixed(0)};bets.unshift(b);saveUser();renderHis();for(var k in picks){var e=document.getElementById(k);if(e)e.classList.remove('sel');}picks={};saveP();document.getElementById('bc').innerText='0';document.getElementById('ls').innerHTML='Saved';document.getElementById('tt').innerHTML='';build();alert('BET K'+b.win);}
function renderHis(){var h=document.getElementById('his');if(!cur){h.innerHTML='Lowani';return;}if(!bets.length){h.innerHTML='Palibe';return;}var out='';for(var i=0;i<bets.length;i++){var b=bets[i];var col=b.status=='WON'?'#00C851':b.status=='LOST'?'#a00':'#ffaa00';var con='';if(b.status=='WON'){con='<div style=background:linear-gradient(45deg,#00C851,#ffaa00);color:#000;padding:12px;border-radius:12px;text-align:center;font-weight:900;margin:8px 0>🎁 CONGRATULATIONS K'+b.win+'<br><span style=font-size:30px>🎁💰🎉</span><br><button onclick=showWin('+b.win+') style=background:#000;color:#00C851;padding:6px 16px;border-radius:20px;border:0>ONANINSO 🎁</button></div>';}else if(b.status=='LOST'){con='<div style=background:#440000;color:#fff;padding:8px;border-radius:10px;text-align:center> Lost 😢 </div>';}else{var tk='';for(var j=0;j<b.picks.length;j++){var pk=b.picks[j];var hh=hist.find(x=>x.mid==pk.match);if(hh){var w=false;if(pk.market.indexOf('OU')==0)w=(hh.ouWinner==pk.team);else w=(hh.winner==pk.team);tk+='<div style=display:flex;justify-content:space-between;background:#111;padding:6px;border-radius:6px;margin:3px 0;border:1px solid '+(w?'#00C851':'#a00')+'><span>'+pk.n+'</span><span style=background:'+(w?'#00C851':'#a00')+';color:#fff;padding:2px 8px;border-radius:10px;font-size:10px>'+(w?'TICK':'X')+'</span></div>';}else tk+='<div style=display:flex;justify-content:space-between;background:#111;padding:6px;border-radius:6px;margin:3px 0><span>'+pk.n+'</span><span style=background:#ffaa00;color:#000;padding:2px 8px;border-radius:10px;font-size:10px>Wait</span></div>';}con=tk;}out+='<div style=background:#222;padding:12px;margin:12px 0;border-left:5px solid '+col+';border-radius:12px>'+con+'<b>'+b.id+'</b> <b style=color:'+col+';float:right>'+b.status+'</b><br>';for(var j=0;j<b.picks.length;j++)out+=b.picks[j].n+' @ '+b.picks[j].o+'<br>';out+='<b>K'+b.stake+' => K'+b.win+'</b></div>';}h.innerHTML=out;}
function exportForNetlify(){var html=document.documentElement.outerHTML;var blob=new Blob([html],{type:'text/html'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(function(){URL.revokeObjectURL(url)},2000);}
if(cur)build();else document.getElementById('games').innerHTML='<div style=padding:30px;text-align:center;color:#888>Lowani - ODDS ULTRA FIX</div>';
document.getElementById('stake').addEventListener('input',upd);
